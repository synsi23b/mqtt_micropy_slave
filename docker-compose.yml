services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt_slave_test_broker
    ports:
      - "1883:1883"
    entrypoint: ["sh", "-c", "printf 'listener 1883 0.0.0.0\\nallow_anonymous true\\n' > /tmp/mosquitto.conf && exec mosquitto -c /tmp/mosquitto.conf"]
    restart: unless-stopped
